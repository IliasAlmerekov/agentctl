name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check public install URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
        run: bun run check:public-install-url

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Smoke test release artifacts
        run: |
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

          artifacts=(
            agentctl-darwin-arm64.tar.gz
            agentctl-darwin-x64.tar.gz
            agentctl-linux-x64.tar.gz
          )
          expected_entries=(
            "./"
            "./agentctl"
            "./agentctl-daemon"
            "./hooks/"
            "./hooks/pre-tool-use"
            "./hooks/post-tool-use"
            "./hooks/subagent-start"
            "./hooks/subagent-stop"
          )
          expected_file="$RUNNER_TEMP/agentctl-expected-archive-entries"
          printf '%s\n' "${expected_entries[@]}" | sort > "$expected_file"

          for artifact in "${artifacts[@]}"; do
            test -s "dist/$artifact"
            grep -q "  $artifact$" dist/SHA256SUMS
            tar -tzf "dist/$artifact" | sort > "$RUNNER_TEMP/$artifact.entries"
            diff -u "$expected_file" "$RUNNER_TEMP/$artifact.entries"
          done
