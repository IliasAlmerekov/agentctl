name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Smoke test release artifacts
        run: |
          test -s dist/SHA256SUMS
          artifacts=(
            agentctl-darwin-arm64
            agentctl-daemon-darwin-arm64
            pre-tool-use-darwin-arm64
            post-tool-use-darwin-arm64
            subagent-start-darwin-arm64
            subagent-stop-darwin-arm64
            agentctl-darwin-x64
            agentctl-daemon-darwin-x64
            pre-tool-use-darwin-x64
            post-tool-use-darwin-x64
            subagent-start-darwin-x64
            subagent-stop-darwin-x64
            agentctl-linux-x64
            agentctl-daemon-linux-x64
            pre-tool-use-linux-x64
            post-tool-use-linux-x64
            subagent-start-linux-x64
            subagent-stop-linux-x64
          )

          for artifact in "${artifacts[@]}"; do
            test -s "dist/$artifact"
            grep -q "  $artifact$" dist/SHA256SUMS
          done

          test -x dist/agentctl-linux-x64
          test -x dist/agentctl-daemon-linux-x64
          test -x dist/pre-tool-use-linux-x64
          test -x dist/post-tool-use-linux-x64
          test -x dist/subagent-start-linux-x64
          test -x dist/subagent-stop-linux-x64
