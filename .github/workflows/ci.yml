name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check public install URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
        run: bun run check:public-install-url

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Smoke test release artifacts
        run: |
          test -s dist/SHA256SUMS
          artifacts=(
            agentctl-darwin-arm64.tar.gz
            agentctl-darwin-x64.tar.gz
            agentctl-linux-x64.tar.gz
          )

          for artifact in "${artifacts[@]}"; do
            test -s "dist/$artifact"
            grep -q "  $artifact$" dist/SHA256SUMS
          done

          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./agentctl$'
          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./agentctl-daemon$'
          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./hooks/pre-tool-use$'
          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./hooks/post-tool-use$'
          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./hooks/subagent-start$'
          tar -tzf dist/agentctl-linux-x64.tar.gz | grep -q '^\./hooks/subagent-stop$'
