name: Release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/agentctl-darwin-arm64.tar.gz
            dist/agentctl-darwin-x64.tar.gz
            dist/agentctl-linux-x64.tar.gz
            dist/SHA256SUMS
          )

          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  release-smoke:
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release assets for private smoke
        if: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/agentctl-release-assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${{ runner.temp }}/agentctl-release-assets" \
            --pattern "agentctl-*.tar.gz" \
            --pattern "SHA256SUMS"

      - name: Public release install smoke
        if: ${{ !github.event.repository.private }}
        env:
          AGENTCTL_VERSION: ${{ github.ref_name }}
          AGENTCTL_SMOKE_INSTALL_SOURCE: public
        run: bash scripts/smoke-install.sh

      - name: Private release assets install smoke
        if: ${{ github.event.repository.private }}
        env:
          AGENTCTL_BASE_URL: file://${{ runner.temp }}/agentctl-release-assets
          AGENTCTL_VERSION: ${{ github.ref_name }}
          AGENTCTL_SMOKE_INSTALL_SOURCE: release-assets
        run: bash scripts/smoke-install.sh
