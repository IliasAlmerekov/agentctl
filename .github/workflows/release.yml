name: Release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/agentctl-darwin-arm64.tar.gz
            dist/agentctl-darwin-x64.tar.gz
            dist/agentctl-linux-x64.tar.gz
            dist/SHA256SUMS
          )

          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  release-smoke:
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/agentctl-release-assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${{ runner.temp }}/agentctl-release-assets" \
            --pattern "agentctl-*.tar.gz" \
            --pattern "SHA256SUMS"

      - name: Release assets install smoke
        env:
          AGENTCTL_BASE_URL: file://${{ runner.temp }}/agentctl-release-assets
          AGENTCTL_VERSION: ${{ github.ref_name }}
          AGENTCTL_SMOKE_INSTALL_SOURCE: release-assets
        run: bash scripts/smoke-install.sh

  publish-release:
    needs: release-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Promote draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
