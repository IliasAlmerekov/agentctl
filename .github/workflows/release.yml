name: Release

on:
  push:
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/agentctl-darwin-arm64
            dist/agentctl-daemon-darwin-arm64
            dist/pre-tool-use-darwin-arm64
            dist/post-tool-use-darwin-arm64
            dist/subagent-start-darwin-arm64
            dist/subagent-stop-darwin-arm64
            dist/agentctl-darwin-x64
            dist/agentctl-daemon-darwin-x64
            dist/pre-tool-use-darwin-x64
            dist/post-tool-use-darwin-x64
            dist/subagent-start-darwin-x64
            dist/subagent-stop-darwin-x64
            dist/agentctl-linux-x64
            dist/agentctl-daemon-linux-x64
            dist/pre-tool-use-linux-x64
            dist/post-tool-use-linux-x64
            dist/subagent-start-linux-x64
            dist/subagent-stop-linux-x64
            dist/SHA256SUMS
          )

          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  release-smoke:
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Public release install smoke
        env:
          AGENTCTL_VERSION: ${{ github.ref_name }}
          AGENTCTL_SMOKE_INSTALL_SOURCE: public
        run: bash scripts/smoke-install.sh
